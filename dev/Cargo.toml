[package]
name = "congestimancer-dev"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata.release]
release = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "congestimancer-dev"
path = "src/main.rs"

[dependencies]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rust]
unreachable_pub = "deny"
unsafe_code = "forbid"
