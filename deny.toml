# cargo-deny policy (nix:V10).

# Only the four supported platforms count, so Windows-only crates pulled in
# by dependencies do not trip `multiple-versions`.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
# Unicode-3.0 arrives with unicode-ident (via clap derive).
allow = ["MIT", "Unicode-3.0"]
# Unicode-3.0 is allowed ahead of clap, which brings it; until then it is
# unmatched, which is expected rather than a finding.
unused-allowed-license = "allow"
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
