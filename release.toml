# cargo-release configuration (nix:T11). The release is the gate passing on
# main, then a tag and a publish; real-machine runs on every test host come
# first (nix:V20), and the first publish needs explicit approval (.:T14).
allow-branch = ["main"]
pre-release-hook = ["hk", "check", "--all", "--check", "--no-fail-fast"]
tag-name = "v{{version}}"
publish = true
verify = true
